<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f4f4;
            overflow: hidden;
            position: relative;
        }

        h2 {
            color: #2c3e50;
        }

        #quiz-container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border: 2px solid #3498db;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
        }

        #question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .option-button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #ecf0f1;
            transition: 0.3s;
        }

        .option-button:hover {
            background-color: #bdc3c7;
        }

        .correct {
            background-color: #2ecc71 !important;
            color: white;
        }

        .incorrect {
            background-color: #e74c3c !important;
            color: white;
        }

        #score-container {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            position: relative;
            z-index: 10;
        }

        /* Green Overlay Effect */
        #progress-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(46, 204, 113, 0.7); /* Greenish overlay */
            transition: height 0.5s ease-in-out;
            z-index: 5;
        }

        .huge-celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: gold;
            font-size: 50px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
        }

        /* Enhanced Restart Button */
        #huge-celebration button {
            padding: 5px 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #3498db; /* Blue background */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            margin-top: 10px;
        }

        #huge-celebration button:hover {
            background-color: #2980b9; /* Darker blue on hover */
            transform: scale(1.1); /* Slightly enlarge the button */
        }

        #huge-celebration button:focus {
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.7); /* Focus effect */
        }
    </style>
</head>
<body>

    <h2>সংশোধনী</h2>

    <div id="quiz-container">
        <p id="question"></p>
        <div id="options"></div>
    </div>

    <div id="score-container">সঠিক উত্তর: <span id="score">0</span></div>
    
    <div id="progress-overlay"></div>

    <div id="huge-celebration" class="huge-celebration">
        🎉 অবিশ্বাস্য! আপনি চমৎকার মেধাবী!🥳🎉  
        <button onclick="resetQuiz()">পুনরায় শুরু করুন</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.3/dist/confetti.browser.min.js"></script>
    <script>
        const questions = [
    { 
        question: "সংবিধানের মোট কতবার সংশোধনী হয়েছে?", 
        options: ["১৫ বার", "১৬ বার", "১৭ বার", "১৮ বার"], 
        answer: "১৭ বার" 
    },
    { 
        question: "সংবিধানের ১ম সংশোধনীতে কোন বিষয়ের উল্লেখ আছে?", 
        options: ["জরুরী অবস্থা ঘোষণা", "যুদ্ধাপরাধীদের বিচার", "বাকশাল গঠন", "রাষ্ট্রধর্ম ইসলাম করা"], 
        answer: "যুদ্ধাপরাধীদের বিচার" 
    },
    { 
        question: "সংবিধানের ২য় সংশোধনীতে কী অন্তর্ভুক্ত করা হয়েছিল?", 
        options: ["যুদ্ধাপরাধীদের বিচার", "সংসদীয় পদ্ধতি পুনরায় চালু", "জরুরী অবস্থা ঘোষণার বিধান", "নিরপেক্ষ তত্ত্বাবধায়ক সরকার"], 
        answer: "জরুরী অবস্থা ঘোষণার বিধান" 
    },
    { 
        question: "সংবিধানের ৩য় সংশোধনীতে কোন বিষয়টি সংশোধন করা হয়েছিল?", 
        options: ["সংসদীয় পদ্ধতি পুনরায় চালু", "তত্ত্বাবধায়ক সরকার বিলুপ্ত", "ছিটমহল ও অপদখলীয় জমি বিনিময়", "নির্বাচন কমিশন গঠন"], 
        answer: "ছিটমহল ও অপদখলীয় জমি বিনিময়" 
    },
    { 
        question: "সংবিধানের ৪র্থ সংশোধনী কোন বিষয়ে সংশোধন এনেছিল?", 
        options: ["জরুরী অবস্থা ঘোষণা", "বাকশাল গঠন", "সংসদীয় পদ্ধতি পুনরায় চালু", "তত্ত্বাবধায়ক সরকার"], 
        answer: "বাকশাল গঠন" 
    },
    { 
        question: "সংবিধানের ৫ম সংশোধনীতে কোন দুটি বিষয় উল্লেখযোগ্য ছিল?", 
        options: ["বাকশাল গঠন ও সংসদীয় পদ্ধতি", "১৯৭৫-১৯৭৯ সামরিক কার্যক্রমের বৈধতা ও 'বিসমিল্লাহির রাহমানির রাহিম' সংযুক্তকরণ", "নিরপেক্ষ তত্ত্বাবধায়ক সরকার ও নির্বাচন ব্যবস্থা", "ছিটমহল বিনিময় ও রাষ্ট্রধর্ম ইসলাম"], 
        answer: "১৯৭৫-১৯৭৯ সামরিক কার্যক্রমের বৈধতা ও 'বিসমিল্লাহির রাহমানির রাহিম' সংযুক্তকরণ" 
    },
    { 
        question: "সংবিধানের ৮ম সংশোধনীতে কোন দুটি গুরুত্বপূর্ণ পরিবর্তন আনা হয়েছিল?", 
        options: ["সংসদীয় পদ্ধতি ও উপরাষ্ট্রপতি বিলুপ্ত", "রাষ্ট্রধর্ম ইসলাম করা ও Dacca থেকে Dhaka পরিবর্তন", "নিরপেক্ষ তত্ত্বাবধায়ক সরকার ও জরুরী অবস্থা বিধান", "সংবিধান সংশোধনের ক্ষমতা সংক্রান্ত পরিবর্তন"], 
        answer: "রাষ্ট্রধর্ম ইসলাম করা ও Dacca থেকে Dhaka পরিবর্তন" 
    },
    { 
        question: "সংবিধানের ১২শ সংশোধনীতে কোন পরিবর্তন আনা হয়?", 
        options: ["সংসদীয় পদ্ধতির পুনরায়বৃত্তি ও উপরাষ্ট্রপতির পদ বিলুপ্ত", "তত্ত্বাবধায়ক সরকার ব্যবস্থা প্রবর্তন", "জরুরী অবস্থা ঘোষণা", "বাকশাল গঠন"], 
        answer: "সংসদীয় পদ্ধতির পুনরায়বৃত্তি ও উপরাষ্ট্রপতির পদ বিলুপ্ত" 
    },
    { 
        question: "সংবিধানের ১৩শ সংশোধনীতে কী অন্তর্ভুক্ত করা হয়েছিল?", 
        options: ["সংসদীয় পদ্ধতি পুনঃপ্রবর্তন", "নিরপেক্ষ নির্দলীয় তত্ত্বাবধায়ক সরকারের অধীনে নির্বাচন", "রাষ্ট্রধর্ম ইসলাম ঘোষণা", "সংবিধান সংশোধনের বিধান"], 
        answer: "নিরপেক্ষ নির্দলীয় তত্ত্বাবধায়ক সরকারের অধীনে নির্বাচন" 
    },
    { 
        question: "সংবিধানের ১৫শ সংশোধনীতে কোন পরিবর্তন আনা হয়েছিল?", 
        options: ["বাকশাল গঠন", "তত্ত্বাবধায়ক সরকার বিলুপ্তিকরণ", "নির্বাচন কমিশন গঠন", "জরুরী অবস্থা ঘোষণা"], 
        answer: "তত্ত্বাবধায়ক সরকার বিলুপ্তিকরণ" 
    }
];
        let score = 0;
        let askedQuestions = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuestion() {
            if (askedQuestions.length === questions.length) {
              
                askedQuestions = [];
                score = 0;
                document.getElementById("score").innerText = score;
                updateProgressOverlay();
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * questions.length);
            } while (askedQuestions.includes(randomIndex));

            askedQuestions.push(randomIndex);
            const questionObj = questions[randomIndex];

            document.getElementById("question").innerText = questionObj.question;
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";

            shuffleArray(questionObj.options);

            questionObj.options.forEach(option => {
                const button = document.createElement("button");
                button.className = "option-button";
                button.innerText = option;
                button.onclick = (e) => checkAnswer(e, button, questionObj.answer);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(event, button, correctAnswer) {
            if (button.innerText === correctAnswer) {
                button.classList.add("correct");
                score++;
                document.getElementById("score").innerText = score;
                updateProgressOverlay();
                launchConfetti(event);
                if (score === questions.length) {
                    showCelebration();
                }
            } else {
                button.classList.add("incorrect");
            }

            setTimeout(loadQuestion, 500);
        }

        function updateProgressOverlay() {
            // Get the total number of questions
            const totalQuestions = questions.length;

            // Calculate progress as a percentage
            let progress = (score / totalQuestions) * 100;

            // Update the height of the progress overlay
            document.getElementById("progress-overlay").style.height = `${progress}%`;
        }

        function showCelebration() {
    document.getElementById("huge-celebration").style.display = "flex";
    
    // Multiple confetti blasts
    for (let i = 0; i < 10; i++) {
        setTimeout(() => {
            confetti({
                particleCount: 150,
                spread: 80,
                startVelocity: 50,
                origin: {
                    x: Math.random(), // Random X position
                    y: Math.random() * 0.5 // Confetti comes from the top half
                }
            });
        }, i * 300); // Blasts at different times
    }
}

        function resetQuiz() {
            score = 0;
            askedQuestions = [];
            document.getElementById("score").innerText = score;
            document.getElementById("progress-overlay").style.height = "0%";
            document.getElementById("huge-celebration").style.display = "none";
            loadQuestion();
        }

        function launchConfetti(event) {
            const buttonPosition = event.target.getBoundingClientRect();
            const buttonCenterX = buttonPosition.left + buttonPosition.width / 2;
            const buttonCenterY = buttonPosition.top + buttonPosition.height / 2;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: {
                    x: buttonCenterX / window.innerWidth,
                    y: buttonCenterY / window.innerHeight
                }
            });
        }

        loadQuestion();
    </script>

</body>
</html>
